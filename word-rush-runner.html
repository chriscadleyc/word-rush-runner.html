<!DOCTYPE html>
<html>
<head>
  <title>Word Rush Runner - Final</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial;
      color: white;
      touch-action: none;
    }

    canvas {
      display: block;
      margin: auto;
      background: #111;
    }

    #ui {
      position: absolute;
      top: 10px;
      width: 100%;
      text-align: center;
      font-size: 14px;
    }

    #gameOver {
      position: absolute;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      font-size: 22px;
    }

    button {
      padding: 10px;
      font-size: 16px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div id="ui">
  <div id="word">Loading...</div>
  <div id="score"></div>
</div>

<div id="gameOver">
  <div id="final"></div>
  <button onclick="location.reload()">Restart</button>
</div>

<canvas id="game" width="800" height="500"></canvas>

<script>
const c = document.getElementById("game");
const ctx = c.getContext("2d");

// GAME STATE
let score=0, coins=0, level=1;
let speed=6;
let dead=false;

// LANES
const lanes=[200,400,600];
let lane=1;

// JUMP
let jump=0, g=0, jumping=false;

// BACKGROUND
let bg=0;

// OBJECTS
let train={lane:0,y:1200};
let coin={lane:1,y:900};
let power={lane:2,y:1500};
let gate={y:800};

// TIMER (5 seconds)
let choiceTime = 300;
let selecting = true;

// WORD SYSTEM
let current={}, options=[], correctLane=0;

const words=[
 {word:"BRAVE",syn:"Courageous",ant:"Cowardly"},
 {word:"FAST",syn:"Quick",ant:"Slow"},
 {word:"HAPPY",syn:"Joyful",ant:"Sad"},
 {word:"BIG",syn:"Large",ant:"Small"},
 {word:"SMART",syn:"Intelligent",ant:"Dumb"}
];

function shuffle(a){return a.sort(()=>Math.random()-0.5);}

// NEW WORD
function newWord(){
 current=words[Math.floor(Math.random()*words.length)];

 let correct=Math.random()>0.5?current.syn:current.ant;

 let pool=words.flatMap(w=>[w.syn,w.ant]).filter(x=>x!==correct);
 pool=shuffle(pool);

 options=[pool[0],pool[1],correct];
 shuffle(options);

 correctLane=options.indexOf(correct);

 choiceTime=300;
 selecting=true;

 document.getElementById("word")="WORD: "+current.word;
}

// DRAW PLAYER
function drawPlayer(){
 ctx.font="40px Arial";
 ctx.textAlign="center";
 ctx.fillText("🏃",lanes[lane],380-jump);
}

// BACKGROUND
function drawBG(){
 bg+=speed;
 ctx.fillStyle="#222";
 for(let i=0;i<12;i++){
  let y=(i*60+bg)%600;
  ctx.fillRect(0,y,800,30);
 }
}

// OPTIONS
function drawOptions(){
 ctx.font="16px Arial";
 ctx.fillStyle="white";
 ctx.textAlign="center";
 for(let i=0;i<3;i++){
  ctx.fillText(options[i],lanes[i],120);
 }
}

// OBJECTS
function drawTrain(){ctx.fillText("🚆",lanes[train.lane],train.y);}
function drawCoin(){ctx.fillText("🪙",lanes[coin.lane],coin.y);}
function drawPower(){ctx.fillText("⚡",lanes[power.lane],power.y);}

// GAME OVER
function endGame(){
 dead=true;
 document.getElementById("gameOver").style.display="flex";
 document.getElementById("final").innerText=
 "Game Over\nScore: "+score+" Coins: "+coins;
}

// UPDATE
function update(){
 if(dead)return;

 ctx.clearRect(0,0,800,500);

 drawBG();

 let spd=speed;

 train.y-=spd;
 coin.y-=spd;
 power.y-=spd;
 gate.y-=spd;

 if(jumping){
  jump+=g;
  g-=0.6;
  if(jump<=0){jump=0;jumping=false;}
 }

 drawPlayer();
 drawTrain();
 drawCoin();
 drawPower();
 drawOptions();

 // TIMER ⏳
 if(selecting){
  choiceTime--;

  if(choiceTime<=0){
   selecting=false;

   // wrong lanes become trains
   for(let i=0;i<3;i++){
    if(i!==correctLane){
     train.lane=i;
     train.y=350;
    }
   }
  }
 }

 // COIN
 if(coin.y<420&&coin.y>360&&coin.lane===lane){
  coins++; coin.y=900;
 }

 // POWER
 if(power.y<420&&power.y>360&&power.lane===lane){
  speed*=0.4;
  setTimeout(()=>speed*=2,2000);
  power.y=1500;
 }

 // TRAIN COLLISION
 if(train.y<420&&train.y>360&&train.lane===lane&&jump<20){
  endGame();
 }

 // RESET OBJECTS
 if(train.y<-100){train.y=1200;train.lane=Math.floor(Math.random()*3);score+=5;}
 if(coin.y<-100){coin.y=900;coin.lane=Math.floor(Math.random()*3);}
 if(power.y<-100){power.y=1500;power.lane=Math.floor(Math.random()*3);}

 // LEVEL
 if(score>=level*50){level++;speed+=0.8;}

 document.getElementById("score").innerText=
 "Score:"+score+" Coins:"+coins+" Level:"+level+
 " Time:"+Math.ceil(choiceTime/60);

 requestAnimationFrame(update);
}

// WORD GATE
function gateLoop(){
 if(dead)return;

 gate.y-=speed;

 if(gate.y<420&&gate.y>360&&selecting){
  selecting=false;

  if(lane===correctLane){
   score+=10;
  }else{
   endGame();
  }

  gate.y=800;
  newWord();
 }

 requestAnimationFrame(gateLoop);
}

// CONTROLS
document.addEventListener("keydown",e=>{
 if(dead)return;

 if(e.key==="ArrowLeft")lane=Math.max(0,lane-1);
 if(e.key==="ArrowRight")lane=Math.min(2,lane+1);

 if(e.key==="ArrowUp"&&!jumping){
  jumping=true;
  g=10;
 }
});

// SWIPE
let sx=0,sy=0;
document.addEventListener("touchstart",e=>{
 sx=e.touches[0].clientX;
 sy=e.touches[0].clientY;
});

document.addEventListener("touchend",e=>{
 if(dead)return;

 let dx=e.changedTouches[0].clientX-sx;
 let dy=e.changedTouches[0].clientY-sy;

 if(Math.abs(dx)>Math.abs(dy)){
  if(dx>40)lane=Math.min(2,lane+1);
  else lane=Math.max(0,lane-1);
 }else{
  if(dy<0&&!jumping){
   jumping=true;
   g=10;
  }
 }
});

// START
newWord();
update();
gateLoop();
</script>

</body>
</html>
